<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pink Aurora</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-pink: #fff0f3;
            --primary-pink: #ff758f;
            --hover-pink: #ff4d6d;
            --dark-rose: #590d22;
            --border-pink: #ffccd5;
            --text-muted: #805b65;
            --light-pink: #ffe5ec;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: linear-gradient(rgba(255, 240, 243, 0.85), rgba(255, 204, 213, 0.85)),
                        url("{{ url_for('static', filename='images/bg.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 35px;
            border-radius: 28px;
            border: 1px solid var(--border-pink);
            box-shadow: 0 15px 35px rgba(255, 117, 143, 0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            color: var(--dark-rose);
            margin: 0 0 6px 0;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .login-card p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0 0 25px 0;
        }

        .error-alert {
            background-color: #fff0f3;
            color: #d90429;
            border: 1px solid #ffccd5;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--dark-rose);
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border-pink);
            border-radius: 14px;
            font-family: inherit;
            font-size: 0.95rem;
            background-color: #fff9fa;
            color: #4a3e3d;
            box-sizing: border-box;
            outline: none;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary-pink);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 117, 143, 0.15);
        }

        .btn-login {
            background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #ff4d6d 0%, #c9184a 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.4);
        }

        .register-footer {
            margin-top: 25px;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .register-footer a {
            color: var(--dark-rose);
            font-weight: 700;
            text-decoration: none;
            transition: var(--transition);
        }

        .register-footer a:hover {
            color: var(--hover-pink);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Welcome Back!</h2>
        <p class="subtitle">Please login to your account</p>

        {% if error %}
        <div class="error-alert">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <div class="register-footer">
            Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
        </div>
    </div>

</body>
</html>
